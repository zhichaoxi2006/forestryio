## Gradle ---------------------------------------------------------------------------------------
# The build is offline by default (see settings.gradle); no repository is contacted unless
# `-Ponline=true` is passed. Keep the daemon enabled: the first ModDevGradle configuration is slow.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Environment ----------------------------------------------------------------------------------
# Minecraft / NeoForge. 21.1.240 is present in this machine's Gradle cache; only change it together
# with -Ponline=true so the new artifacts can be downloaded.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.240
neo_version_range=[21.1,)
loader_version_range=[4,)
java_version=21

# Parchment parameter mappings (already cached).
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Dependencies ---------------------------------------------------------------------------------
# Both mods are development jars in libs/ (see libs/README.md). The build resolves them without a
# repository, which is required on this machine because maven.neoforged.net is unreachable.
#
# LaserIO - https://github.com/Direwolf20-MC/LaserIO - MIT
laserio_version=1.9.11
laserio_version_range=[1.9.11,)
# Forestry: Community Edition - https://github.com/thedarkcolour/ForestryCE - LGPL-3.0-only
forestry_version=3.0.0-alpha9
forestry_version_range=[3.0.0-alpha9,)
# Patchouli is a hard runtime dependency of Forestry: CE (not of this mod). - CC BY-NC-SA 3.0
patchouli_version=1.21.1-93-NEOFORGE
patchouli_version_range=[1.21.1-92,)

## Mod properties -------------------------------------------------------------------------------
mod_id=forestryio
mod_name=Forestry IO
mod_license=LGPL-3.0-only
mod_version=0.1.1
mod_group_id=com.zhichaoxi.forestryio
mod_authors=zhichaoxi2006
mod_description=A Forestry: Community Edition and LaserIO integration add-on, including a genome-aware LaserIO filter for Forestry's genetic items (bees, trees, butterflies...).
